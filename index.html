<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kalkulator Keuangan</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="app-header">
    <h1>Kalkulator Keuangan</h1>
    <p>Catat pemasukan dan pengeluaranmu di satu tempat.</p>
  </header>

  <main class="container">

        <!-- RINGKASAN (diisi Anggota 2: hitung saldo/total) -->
    <section class="summary" aria-label="Ringkasan keuangan">
      <div class="summary-card summary-income">
        <span class="summary-label">Total pemasukan</span>
        <strong id="total-pemasukan">Rp 0</strong>
      </div>
      <div class="summary-card summary-expense">
        <span class="summary-label">Total pengeluaran</span>
        <strong id="total-pengeluaran">Rp 0</strong>
      </div>
      <div class="summary-card summary-balance">
        <span class="summary-label">Saldo</span>
        <strong id="saldo">Rp 0</strong>
      </div>
    </section>

    <!-- [FORM] -->

    <!-- [GRAFIK] -->

    <!-- [TABEL] -->

  </main>

  <footer class="app-footer">Tugas Kuliah Pengembangan Perangkat Lunak Kolaboratif</footer>

  <!-- Chart.js harus dimuat sebelum chart.js milik proyek -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
  <script src="storage.js"></script>
  <script src="transactions.js"></script>
  <script src="chart.js"></script>
</body>
</html>
